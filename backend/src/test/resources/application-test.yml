spring:
  datasource:
    url: jdbc:h2:mem:fuerzaupt_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025
    username: no-reply@fuerzaupt.pe

app:
  admin:
    bootstrap-enabled: false
  mail:
    provider: disabled
  privacy:
    hmac-secret: test-secret-with-at-least-thirty-two-characters-long

